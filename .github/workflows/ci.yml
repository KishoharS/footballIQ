name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Locked strictly to 3.11 to mirror the Dockerfile and prevent false positives
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with flake8
        run: |
          flake8 api.py --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 api.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Format check with black
        run: black --check api.py

      - name: Type checking with mypy
        run: mypy api.py --ignore-missing-imports
        continue-on-error: true

      - name: Security check with bandit
        run: |
          pip install bandit
          bandit -r api.py -ll
        continue-on-error: true

      # ADDED: Actually run your tests!
      - name: Run unit tests
        run: pytest
        continue-on-error: false # If tests fail, the pipeline should fail

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: false
          tags: footballiq:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: footballiq:${{ github.sha }}
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: 'trivy-results.sarif'
          
      # OPTIONAL ARCHITECTURE UPGRADE: 
      # If you want Render to ONLY deploy if this Trivy scan passes, 
      # turn off "Auto-Deploy" in Render, copy your Deploy Hook URL, 
      # add it to GitHub Secrets as RENDER_DEPLOY_HOOK, and uncomment the step below:
      
      # - name: Trigger Render Deployment
      #   if: success()
      #   run: curl ${{ secrets.RENDER_DEPLOY_HOOK }}